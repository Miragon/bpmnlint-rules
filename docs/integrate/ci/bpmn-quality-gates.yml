# Example workflow — copy to .github/workflows/bpmn-quality-gates.yml in your repo.
# Every value marked PLACEHOLDER must be adapted to your project.
# Docs: https://miragon.github.io/bpmnlint-rules/integrate/ci
name: BPMN quality gates

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.bpmn' # PLACEHOLDER: same files as BPMN_GLOB
      - '.bpmnlintrc'

env:
  BPMN_GLOB: '**/*.bpmn' # PLACEHOLDER: the models to check (bash globstar pattern)
  NODE_PROJECT_DIR: '.' # PLACEHOLDER: directory with the package.json that pins bpmnlint + .bpmnlintrc
  FAIL_ON_HIGH_SEVERITY: 'false' # set to 'true' to fail the check on a high-severity visual finding

jobs:
  lint-bpmn:
    name: Lint BPMN models (geometry)
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.lint.outputs.report }}
      visual-review-enabled: ${{ steps.token.outputs.enabled }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.NODE_PROJECT_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.NODE_PROJECT_DIR }}
        run: npm ci

      - name: Check for the visual-review secret
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "enabled=${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Lint BPMN models
        id: lint
        run: |
          shopt -s globstar nullglob
          # shellcheck disable=SC2206
          models=( $BPMN_GLOB )
          printf 'BPMN models under test:\n'
          printf '  %s\n' "${models[@]}"
          models=( "${models[@]/#/$GITHUB_WORKSPACE/}" )
          set +e
          set -o pipefail
          (cd "$NODE_PROJECT_DIR" && npx bpmnlint "${models[@]}") 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee /tmp/lint-report.txt
          code=$?
          {
            echo 'report<<LINTEOF'
            cat /tmp/lint-report.txt
            echo LINTEOF
          } >> "$GITHUB_OUTPUT"
          exit $code

  visual-review:
    name: Visual review (AI judgment, advisory)
    needs: lint-bpmn
    if: needs.lint-bpmn.outputs.visual-review-enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.collect.outputs.verdict }}
      summary: ${{ steps.collect.outputs.summary }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.NODE_PROJECT_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.NODE_PROJECT_DIR }}
        run: npm ci

      - name: Install Claude Code CLI and the verify-model-visually skill
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add Miragon/bpmnlint-rules
          claude plugin install bpmnlint-rules@miragon-bpmnlint

      - name: Run visual review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          cat > /tmp/review-prompt.md <<PROMPT
          Review every BPMN model matching the bash globstar pattern \`$BPMN_GLOB\`
          for visual / layout defects.

          Use the \`bpmnlint-rules:verify-model-visually\` skill (invoke it via the
          Skill tool) to do the actual review — it owns the method: render the model,
          inspect the rendered picture, and check it against the style guide. Apply it
          to each model. Do not reimplement the method here; rely on the skill.

          Geometry is already enforced by the upstream \`lint-bpmn\` job that gates this
          one, so do NOT run bpmnlint again — skip the skill's lint step and run only
          its visual judgment pass. (The skill documents this opt-out.)

          Then, based on the skill's findings, write TWO files at the repo root and
          post nothing yourself:

            verdict.json — EXACTLY this shape, no prose around it:
              {
                "verdict": "pass" | "fail",
                "findings": [
                  { "model": "<path>", "element": "<name>", "issue": "<what>",
                    "rule": "<style guide rule>", "severity": "high|medium|low" }
                ]
              }
            Set "verdict" to "fail" if and only if at least one finding is high
            severity — an invisible/undrawn element, any shape-or-label overlap, or a
            flow crossing or routed through a shape. Cosmetic spacing, routing length,
            and naming nits are medium/low and must not fail the verdict.

            verdict.md — use EXACTLY this template every time, so the posted comment
            always looks the same. Fill in the values; add no extra sections or prose.
            In the Model column put ONLY a markdown link whose text is the bare file
            name and whose target is the repo-relative path, e.g.
            [order.bpmn](processes/order.bpmn).

              **Verdict:** <✅ PASS | ❌ FAIL>

              | Severity | Model | Element | Issue | Rule |
              | --- | --- | --- | --- | --- |
              | <one row per finding, ordered high → low; Model = [name](path)> |

              If there are no findings, use a single row:
              | – | – | – | No issues found. | – |
          PROMPT
          claude -p "$(cat /tmp/review-prompt.md)" \
            --allowedTools "Bash Read Glob Write Skill" \
            --dangerously-skip-permissions

      - name: Collect results
        id: collect
        if: always()
        run: |
          verdict=$(jq -r '.verdict' verdict.json 2>/dev/null || echo error)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<SUMEOF'
            if [ -f verdict.md ]; then cat verdict.md; else echo "_No verdict produced._"; fi
            echo SUMEOF
          } >> "$GITHUB_OUTPUT"

      - name: Enforce verdict
        run: |
          if [ ! -f verdict.json ]; then
            echo "::warning::The visual review produced no verdict.json."
            [ "$FAIL_ON_HIGH_SEVERITY" = "true" ] && exit 1
            exit 0
          fi
          cat verdict.json
          echo

          jq -r '.findings[]? | "::warning::[\(.severity)] \(.model) — \(.element): \(.issue) (\(.rule))"' verdict.json

          verdict=$(jq -r '.verdict' verdict.json)
          if [ "$verdict" = "fail" ] && [ "$FAIL_ON_HIGH_SEVERITY" = "true" ]; then
            echo "::error::Visual review found high-severity layout issues. See warnings above."
            exit 1
          fi
          echo "Visual review verdict: $verdict (advisory unless FAIL_ON_HIGH_SEVERITY=true)."

  post-comment:
    name: Post quality-gates comment
    needs: [lint-bpmn, visual-review]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
      - name: Build and post sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_RESULT: ${{ needs.lint-bpmn.result }}
          LINT_REPORT: ${{ needs.lint-bpmn.outputs.report }}
          VIS_ENABLED: ${{ needs.lint-bpmn.outputs.visual-review-enabled }}
          VIS_RESULT: ${{ needs.visual-review.result }}
          VIS_SUMMARY: ${{ needs.visual-review.outputs.summary }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## BPMN quality gates"
            echo

            if [ "$LINT_RESULT" = "success" ]; then
              echo "### Geometry (bpmnlint) — ✅ passed"
            elif [ "$LINT_RESULT" = "failure" ]; then
              echo "### Geometry (bpmnlint) — ❌ failed"
              echo
              echo '```'
              printf '%s\n' "$LINT_REPORT"
              echo '```'
            else
              echo "### Geometry (bpmnlint) — ⤼ $LINT_RESULT"
            fi
            echo

            echo "### Visual review (AI judgment, advisory)"
            echo
            if [ "$LINT_RESULT" != "success" ]; then
              echo "⤼ skipped — the geometry gate failed; fix that first."
            elif [ "$VIS_ENABLED" != "true" ]; then
              echo "⤼ skipped — no \`CLAUDE_CODE_OAUTH_TOKEN\` secret configured."
            elif [ -n "$VIS_SUMMARY" ]; then
              printf '%s\n' "$VIS_SUMMARY"
            else
              echo "⚠️ no result produced ($VIS_RESULT)."
            fi
          } > /tmp/comment.md

          gh pr comment "$PR" -R "$REPO" --edit-last -F /tmp/comment.md \
            || gh pr comment "$PR" -R "$REPO" -F /tmp/comment.md

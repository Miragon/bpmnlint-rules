name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-check:
    name: Pin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact-pinned dependencies
        uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unused files/deps/exports (knip)
        run: npm run knip

      - name: Architecture check (dependency-cruiser)
        run: npm run lint:deps

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Times every rule on its own against a 5,000-node model: a Miragon rule over its target
      # time, without one, or scaling worse than linear fails the build.
      - name: Rule benchmark
        run: npm run bench

      # Packs + installs the tarball into a throwaway consumer, then drives the real
      # bpmnlint CLI (classic path) + the resolver (programmatic) — catching packaging
      # gaps the src-based unit tests can't see.
      - name: Distro smoke test
        run: npm run test:distro

  # Runs the GitHub Action exactly as a consumer does (`uses:` builds it from its own checkout):
  # a clean model passes, a model with errors fails the step, and a path with a space and brackets
  # survives the quoting. Commenting needs a pull request token and is covered by
  # test/action/sticky-comment.spec.ts instead.
  action:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Put a model with errors at an awkward path
        run: |
          mkdir -p "action-test/sub dir"
          cp test/fixtures/rules/no-generated-ids/invalid.bpmn "action-test/sub dir/order [1].bpmn"

      - name: Lint a clean model
        id: clean
        uses: ./
        with:
          files: test/fixtures/valid/*.bpmn
          changed-only: 'false'
          comment: 'false'

      - name: Lint a model with errors
        id: errors
        continue-on-error: true
        uses: ./
        with:
          files: action-test/sub dir/order [1].bpmn
          preset: strict
          changed-only: 'false'
          comment: 'false'

      - name: Check the outcomes
        env:
          CLEAN_ERRORS: ${{ steps.clean.outputs.error-count }}
          ERRORS_OUTCOME: ${{ steps.errors.outcome }}
          ERRORS_COUNT: ${{ steps.errors.outputs.error-count }}
        run: |
          test "$CLEAN_ERRORS" = 0
          test "$ERRORS_OUTCOME" = failure
          test "$ERRORS_COUNT" -gt 0

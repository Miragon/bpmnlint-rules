"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
run_mode = "concurrent"

# Rule specs in watch mode (Vitest).
[scripts.run.test]
command = "npm run test:watch"
icon = "test-tube"

# Docs site with hot reload (VitePress).
[scripts.run.docs]
command = "npm run build && npm run dev --workspace docs -- --port ${CONDUCTOR_PORT:-5173}"
icon = "book-open"
